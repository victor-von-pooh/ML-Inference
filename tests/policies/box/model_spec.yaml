format_version: 1
name: policy
inputs:
  obs:
    shape: [1, 3]
nodes:
  hidden:
    unit: nn.Linear
    params: {in_features: 3, out_features: 8}
    inputs: obs
  act: {unit: nn.Tanh, inputs: hidden}
  head:
    unit: nn.Linear
    params: {in_features: 8, out_features: 1}
    inputs: act
outputs: {out: head}
