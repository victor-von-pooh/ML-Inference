[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-inference"
version = "0.1.0"
description = "学習したモデルで新しいデータを推論し, 予測から結論を出して価値として提供するライブラリ"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas>=2.0",
    "pyyaml",
    "torch>=2.2",
    "ml-eda[parquet] @ git+https://github.com/victor-von-pooh/ML-EDA.git",
    "ml-modelcontrol @ git+https://github.com/victor-von-pooh/ML-ModelControl.git"
]

[project.optional-dependencies]
all = [
    "ml-eda[all] @ git+https://github.com/victor-von-pooh/ML-EDA.git"
]
dev = [
    "pytest"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 重みをネットワークで取りに行くテストは, -m network を選んだときだけ
addopts = "-m 'not network'"
markers = [
    "network: 本物の重みをネットワークで取りに行くテスト"
]
